  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #00c9a7;
      --primary-dark: #00a88c;
      --danger: #ff3c3c;
      --warning: #ffa500;
      --success: #00c864;
      --bg-dark: #0a0e27;

    body {

      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f2027 100%);
      min-height: 100vh;
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 20% 20%, rgba(0, 201, 167, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 100, 255, 0.08) 0%, transparent 50%);
      z-index: -1;
      animation: bgMove 20s ease-in-out infinite;
    }

    @keyframes bgMove {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.1) rotate(5deg); }
    }

    /* ===== HEADER ===== */
    header {
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 14, 39, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 201, 167, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo-icon {
      font-size: 28px;
      filter: drop-shadow(0 0 8px var(--primary));
    }

    .logo-text {
      background: linear-gradient(135deg, var(--primary), #00ffcc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-text span {
      color: var(--text-light);
      -webkit-text-fill-color: var(--text-light);
      font-weight: 400;
      font-size: 14px;
    }

    .header-links {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .header-links a {
      color: var(--text-light);
      text-decoration: none;
      font-size: 18px;
      transition: 0.3s;
    }

    .header-links a:hover {
      color: var(--primary);
      transform: translateY(-2px);
    }

    /* ===== MAIN ===== */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      background: var(--bg-card);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 201, 167, 0.25);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent, rgba(0, 201, 167, 0.05), transparent);
      animation: shimmer 3s infinite;
      pointer-events: none;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }

    .icon {
      font-size: 52px;
      text-align: center;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 15px rgba(0, 201, 167, 0.5));
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    h1 {
      color: #fff;
      text-align: center;
      font-size: 26px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .subtitle {
      color: var(--text-muted);
      text-align: center;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid rgba(0, 201, 167, 0.3);
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: rgba(255, 255, 255, 0.95);
      color: #333;
      transition: 0.3s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 201, 167, 0.2);
    }

    button {
      padding: 14px 28px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 201, 167, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loader {
      display: none;
      text-align: center;
      color: #fff;
      margin: 20px 0;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      margin: 0 auto 10px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .result {
      display: none;
      padding: 24px;
      border-radius: 14px;
      color: #fff;
      margin-top: 10px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result.safe {
      background: rgba(0, 200, 100, 0.15);
      border: 2px solid var(--success);
    }

    .result.breached {
      background: rgba(255, 60, 60, 0.15);
      border: 2px solid var(--danger);
    }

    .result.error {
      background: rgba(255, 165, 0, 0.15);
      border: 2px solid var(--warning);
    }

    .result h3 {
      font-size: 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result p {
      font-size: 14px;
      line-height: 1.6;
    }

    .breach-list {
      list-style: none;
      margin-top: 14px;
    }

    .breach-list li {
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.25);
      margin: 8px 0;
      border-radius: 8px;
      font-size: 13px;
      border-left: 3px solid var(--danger);
    }

    .breach-list li strong {
      color: #ffd700;
    }

    .privacy-note {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;

      line-height: 1.6;
    }

    }

    /* ===== FOOTER ===== */
    footer {
      padding: 30px 20px;
      text-align: center;

      border-top: 1px solid rgba(0, 201, 167, 0.2);
      backdrop-filter: blur(10px);
    }

    .footer-brand {

    .footer-brand .hex {

    .footer-made strong {

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
    }

    .social-links a {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 201, 167, 0.1);
      border: 1px solid rgba(0, 201, 167, 0.3);
      border-radius: 50%;
      color: var(--text-light);
      font-size: 18px;
      text-decoration: none;
      transition: 0.3s;
    }

    .social-links a:hover {
      background: var(--primary);
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 201, 167, 0.4);
    }

    .copyright {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 20px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      header { padding: 15px 20px; }
      .logo { font-size: 18px; }
      .logo-icon { font-size: 24px; }
      .header-links a { font-size: 16px; }
      .container { padding: 25px; }
      h1 { font-size: 22px; }
      .input-group { flex-direction: column; }
      button { justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <span class="logo-icon">🛡️</span>
      <div class="logo-text">HexBytes <span>| Cyber Security</span></div>
    </div>
    <div class="header-links">
      <a href="https://github.com/" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
      <a href="https://linkedin.com/" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
      <a href="https://twitter.com/" target="_blank" title="Twitter/X"><i class="fab fa-x-twitter"></i></a>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <div class="container">
      <div class="icon">🔍</div>
      <h1>Email Breach Checker</h1>
      <p class="subtitle">Check karein kya aapka email kisi data breach mein leak hua hai</p>

      <div class="input-group">
        <input 
          type="email" 
          id="emailInput" 
          placeholder="apna@email.com daalein"
          onkeypress="if(event.key==='Enter') checkBreach()"
        />
        <button id="checkBtn" onclick="checkBreach()">
          <i class="fas fa-search"></i> Check
        </button>
      </div>

      <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Check ho raha hai...</p>
      </div>

      <div class="result" id="result"></div>

      <p class="privacy-note">
        🔒 Aapka email hamare server par store nahi hota.<br>
        Powered by <a href="https://haveibeenpwned.com" target="_blank">Have I Been Pwned</a>
      </p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-brand"><span class="hex">HexBytes</span> 🛡️</div>
    <div class="footer-made">Made with ❤️ by <strong>Kuldeep</strong></div>
    <div class="social-links">
      <a href="https://github.com/" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
      <a href="https://linkedin.com/" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
      <a href="https://twitter.com/" target="_blank" title="Twitter/X"><i class="fab fa-x-twitter"></i></a>
      <a href="https://instagram.com/" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="mailto:contact@hexbytes.com" title="Email"><i class="fas fa-envelope"></i></a>
    </div>
    <div class="copyright">© 2025 HexBytes. All rights reserved.</div>
  </footer>

  <!-- SCRIPT -->
  <script>
    // ⚠️ Step 6 ke baad apna Cloudflare Worker URL yahan daalein
    const WORKER_URL = 'YOUR_WORKER_URL_HERE';

    async function checkBreach() {
      const email = document.getElementById('emailInput').value.trim();
      const resultDiv = document.getElementById('result');
      const loader = document.getElementById('loader');
      const btn = document.getElementById('checkBtn');

      // Validation
      if (!email) {
        alert('Kripya apna email daalein');
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        alert('Sahi email format daalein (jaise: naam@example.com)');
        return;
      }

      // Demo mode check
      if (WORKER_URL === 'YOUR_WORKER_URL_HERE') {
        showResult('error', '🔧 Setup Pending',
          'Abhi Cloudflare Worker URL set nahi hai. Step 6 complete karein.<br><br>UI test ke liye ye demo result hai.');
        return;
      }

      // UI reset
      loader.style.display = 'block';
      resultDiv.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';

      try {
        const response = await fetch(`${WORKER_URL}?email=${encodeURIComponent(email)}`);
        const data = await response.json();

        if (data.breached === false) {
          showResult('safe', '✅ Good News!',
            `Aapka email <strong>${email}</strong> kisi known data breach mein nahi mila. Aap safe hain! 🎉`);
        } 
        else if (data.breached === true) {
          const breaches = data.breaches || [];
          const listHTML = breaches.map(b => `
            <li>
              <strong>${b.Name}</strong> (${new Date(b.BreachDate).getFullYear()})<br>
              Leaked data: ${b.DataClasses.join(', ')}
            </li>
          `).join('');

          showResult('breached', `⚠️ ${breaches.length} Breach Mile!`,
            `Aapka email <strong>${email}</strong> in data breaches mein mila. Turant password change karein!<br>
            <ul class="breach-list">${listHTML}</ul>`);
        } 
        else {
          showResult('error', '❌ Error',
            data.error || 'Kuch problem aayi. Baad mein try karein.');
        }

      } catch (error) {
        showResult('error', '❌ Network Error',
          'Internet connection check karein ya baad mein try karein.');
      } finally {
        loader.style.display = 'none';
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-search"></i> Check';
      }
    }

    function showResult(type, title, message) {
      const resultDiv = document.getElementById('result');
      resultDiv.className = 'result ' + type;
      resultDiv.innerHTML = `<h3>${title}</h3><p>${message}</p>`;
      resultDiv.style.display = 'block';
    }
  </script>

</body>
</html>
